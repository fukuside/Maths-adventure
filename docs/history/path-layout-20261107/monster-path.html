<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>モンスターみちつなぎ</title><style>html,body{margin:0;min-height:100%;background:#1b322c}*{box-sizing:border-box}button:focus-visible{outline:3px solid #df8d24;outline-offset:2px}#monster-path-demo{padding:10px 10px max(25px,env(safe-area-inset-bottom));min-height:100dvh}#monster-path-demo .hero-list{overflow-x:auto;padding-bottom:7px}#monster-path-demo .hero-pick{flex:0 0 115px}#monster-path-demo .game{max-width:530px}#monster-path-demo .cutin{position:fixed;inset:0;padding:12px}#monster-path-demo .victory-card.illustrated{max-width:380px;max-height:95dvh;overflow:auto}#monster-path-demo .victory-scene{max-height:43dvh}#monster-path-demo .skill-box{width:100%}@media(orientation:landscape)and(max-height:600px){#monster-path-demo .game{max-width:780px}#monster-path-demo .board{max-width:400px;margin-left:auto;margin-right:auto}#monster-path-demo .hero-pick img{height:44px}#monster-path-demo .victory-card.illustrated{max-width:540px}#monster-path-demo .victory-scene{width:50%;max-height:40dvh;margin:auto}}</style><script src="/reward-games/reward-lobby.js"></script></head><body><div id="monster-path-demo" class="maze-app" style="position:relative">

#monster-path-demo{padding:16px;color:#263e35;font-family:system-ui,sans-serif}#monster-path-demo .game{max-width:460px;margin:auto;background:#eff8e5;border-radius:24px;padding:20px;box-shadow:0 8px 30px #23452520}#monster-path-demo .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#monster-path-demo h2{margin:0;font-size:21px}#monster-path-demo .board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0;background:#8fb888;padding:8px;border-radius:18px;position:relative}#monster-path-demo .tile{padding:0;aspect-ratio:1;border:0;border-radius:12px;background:#d7edbe;position:relative;overflow:hidden;touch-action:manipulation}#monster-path-demo .tile svg{display:block;width:100%;height:100%}#monster-path-demo .tile.linked{background:#a9e4bc}#monster-path-demo .mark{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;pointer-events:none;filter:drop-shadow(0 2px 2px #3334)}#monster-path-demo .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#monster-path-demo .action{border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:600;background:#206b4a;color:white;min-height:48px}#monster-path-demo .secondary{background:#dae7d2;color:#294a37}#monster-path-demo .status{text-align:center;min-height:48px;display:grid;place-items:center;font-weight:600}#monster-path-demo .score{padding-top:10px;text-align:center}#monster-path-demo button:disabled{opacity:.6}#monster-path-demo .win{animation:path-pop .5s ease} @keyframes path-pop{50%{transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){#monster-path-demo .win{animation:none}}@media(max-width:380px){#monster-path-demo{padding:4px}#monster-path-demo .game{padding:12px}#monster-path-demo .mark{font-size:25px}}

function updateStoneUI(){missionCopy();const tool=root.querySelector('[data-stone-tool]');tool.hidden=stoneRequired===0;root.querySelector('[data-stone-toggle]').disabled=busy;root.querySelector('[data-stone-toggle]').setAttribute('aria-pressed',String(stoneMode));root.querySelector('[data-stone-toggle]').textContent=stoneMode?'🪨 石をおく・もどす':'🪨 石をおく';root.querySelector('[data-stone-count]').textContent='今回つかう石：'+stoneRequired+' 個　（おいた石 '+stones.size+' 個）';const panel=root.querySelector('[data-stone-directions]');panel.hidden=!stoneMode||stoneCell<0||busy;for(const b of panel.querySelectorAll('[data-dir]')){const d=Number(b.dataset.dir);b.disabled=busy||(!tiles[stoneCell]?.includes(d)&&!blocked(stoneCell,d));b.textContent=['↑','→','↓','←'][d]+(blocked(stoneCell,d)?' 🪨 もどす':' におく');}}
root.querySelector('[data-stone-toggle]').onclick=()=>{if(busy)return;stoneMode=!stoneMode;stoneCell=-1;status.textContent=stoneMode?'🪨 道のマス → ふさぐ方向をタップ':'👆 道を まわそう';draw();};for(const b of root.querySelector('[data-stone-directions]').querySelectorAll('[data-dir]'))b.onclick=()=>placeStone(stoneCell,Number(b.dataset.dir));

if(!restore(saved))make();else if(!finish)status.textContent='💾 ステージ '+level+' のつづきから';
const lobby=RewardGameLobby({root,title:'🌿 モンスターみちつなぎ',picker,persistent:[audioButton],nodes:[root.querySelector('.game')],intro:'持っているNカードから主人公を選ぼう。つづきのステージから遊べるよ。',rules:['道をタップして回し、スタートから宝箱までつなごう。','仲間がいるときは、その道も通って一緒にゴール！','石はミッション用。スキルはどのステージでも1回使えるよ。'],detail:()=>cards[selected].name+'：'+skills[heroSkills[selected]]+' — '+skillDescriptions[heroSkills[selected]],fallback:src=>cards.find(c=>c.image===src)?.originalImage,canBack:()=>!busy||finish,onStart:()=>{inPlay=true;unlock();if(finish)showVictory();},onBack:()=>{inPlay=false;stopMusic();root.querySelector('[data-cutin]').hidden=true;persist();}});root.querySelector('[data-cutin]').hidden=true;

})();
